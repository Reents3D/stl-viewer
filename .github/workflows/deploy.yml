name: Deploy to GitHub Pages

# Jeder Push auf main baut und veroeffentlicht.
#
# Voraussetzung, falls das Repository jemals neu aufgesetzt wird: Pages muss in
# den Einstellungen auf "GitHub Actions" als Quelle stehen. Sonst scheitert
# actions/configure-pages bei jedem Lauf - und eine dauerhaft rote Pipeline
# sieht sich nach zwei Wochen niemand mehr an, dann faellt auch der echte
# Fehler nicht mehr auf.
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Basispfad kommt aus vite.config.ts und steht seit dem Umzug auf
      # viewer.reents3d.de auf "/". Kein VITE_BASE mehr noetig.
      #
      # Die Domain selbst haengt an public/CNAME. Die Datei MUSS im Artefakt
      # liegen: Ein Pages-Deploy ohne sie setzt die eigene Domain in den
      # Einstellungen zurueck, und die Seite ist nur noch ueber die
      # github.io-Adresse erreichbar.
      - run: npm run build
      - name: Artefakt pruefen (Richtlinie, externe Ressourcen)
        run: node scripts/check-artifact.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
