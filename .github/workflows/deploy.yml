name: Deploy to GitHub Pages

# NUR VON HAND, SOLANGE DAS REPOSITORY PRIVAT IST.
#
# GitHub Pages braucht fuer ein privates Repository einen kostenpflichtigen Tarif
# und muss zusaetzlich in den Einstellungen aktiviert sein. Ohne das scheitert
# actions/configure-pages bei JEDEM Push - und eine Pipeline, die immer rot ist,
# sieht sich nach zwei Wochen niemand mehr an. Dann faellt auch der echte Fehler
# nicht mehr auf.
#
# ZUM VEROEFFENTLICHEN:
#   1. Repository oeffentlich schalten (oder Pages im Tarif freischalten)
#   2. Einstellungen > Pages > Source: GitHub Actions
#   3. Hier die naechste Zeile einkommentieren:
# on:
#   push: { branches: [main] }
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Basispfad ueber die Umgebung: derselbe Bau laeuft unter
          # reents3d.github.io/stl-viewer/ und spaeter unter einer eigenen Domain.
          VITE_BASE: /stl-viewer/
      - name: Artefakt pruefen (Richtlinie, externe Ressourcen)
        run: node scripts/check-artifact.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
