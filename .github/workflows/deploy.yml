name: Deploy to GitHub Pages

# Jeder Push auf main baut und veroeffentlicht.
#
# Voraussetzung, falls das Repository jemals neu aufgesetzt wird: Pages muss in
# den Einstellungen auf "GitHub Actions" als Quelle stehen. Sonst scheitert
# actions/configure-pages bei jedem Lauf - und eine dauerhaft rote Pipeline
# sieht sich nach zwei Wochen niemand mehr an, dann faellt auch der echte
# Fehler nicht mehr auf.
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Basispfad kommt aus vite.config.ts und steht seit dem Umzug auf
      # viewer.reents3d.de auf "/". Kein VITE_BASE mehr noetig.
      #
      # WO DIE DOMAIN WIRKLICH HAENGT — nicht an public/CNAME.
      # Bei Veroeffentlichung ueber Actions (build_type: workflow) liest GitHub
      # die eigene Domain NUR aus den Repository-Einstellungen; eine CNAME-Datei
      # im Artefakt wird nicht ausgewertet. Beim klassischen Zweig-Deploy ist es
      # umgekehrt — daher die verbreitete Gegenbehauptung.
      #
      # Am 2026-08-07 einmal teuer gelernt: Basispfad auf "/" umgestellt und
      # veroeffentlicht, waehrend die Domain in den Einstellungen leer stand.
      # Ergebnis war eine weisse Seite unter der alten Adresse (Dateiverweise
      # zeigten auf die Wurzel) und nichts unter der neuen. Stand per API
      # gepruefte Wahrheit:
      #   gh api repos/Reents3D/stl-viewer/pages   → "cname" darf nicht null sein
      #
      # public/CNAME bleibt trotzdem im Buendel: Es kostet nichts, dokumentiert
      # die Zugehoerigkeit und traegt, falls das Repository je wieder ueber
      # einen Zweig veroeffentlicht.
      - run: npm run build
      - name: Artefakt pruefen (Richtlinie, externe Ressourcen)
        run: node scripts/check-artifact.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
