name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Die Zusage "kein Upload" haengt an einer einzigen Zeile im ausgelieferten
      # HTML. Faellt sie durch eine Aenderung an der Bauweise weg, merkt das sonst
      # niemand - die Anwendung funktioniert ohne sie genauso gut. Deshalb prueft
      # die Pipeline das ARTEFAKT, nicht den Quelltext.
      - name: Artefakt pruefen (Richtlinie, externe Ressourcen)
        run: node scripts/check-artifact.mjs dist

      # Seit ADR-013 laesst die Richtlinie Anfragen an die EIGENE Herkunft zu -
      # noetig fuer die WebAssembly des STEP-Imports. Damit aus dieser Oeffnung
      # kein Einfallstor wird, darf der EIGENE Quelltext weiterhin keinen
      # Netzwerkaufruf enthalten. Was OpenCascade intern tut, holt genau eine
      # statische Datei von derselben Adresse.
      - name: Keine ausgehenden Aufrufe im eigenen Quelltext
        run: |
          set -e
          if grep -rnE '\b(fetch|XMLHttpRequest|sendBeacon|WebSocket|EventSource)\s*\(' src/ extension/*.js; then
            echo "FEHLER: ausgehender Aufruf im Quelltext gefunden."
            echo "Auch mit connect-src 'self' baut dieses Projekt keine Verbindung selbst auf."
            echo "Siehe ADR-001 und ADR-013."
            exit 1
          fi
          echo "Keine ausgehenden Aufrufe im eigenen Quelltext."

      # Die Erweiterung ist dasselbe Werkzeug aus demselben Quelltext (ADR-015).
      # Sie hier mitzubauen kostet zwei Sekunden und faengt den Fall, den sonst
      # erst die Ablehnung durch den Store meldet: eine Aenderung an der
      # Richtlinie oder am Bau, nach der das Paket nicht mehr laedt. Zwischen
      # zwei Einreichungen liegen Wochen - so lange darf der Bruch nicht liegen
      # bleiben.
      - run: npm run build:ext
      - name: Erweiterungspaket pruefen (Manifest, Berechtigungen, Symbole)
        run: npm run check:ext
